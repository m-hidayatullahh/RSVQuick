server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Catatan: SSL diterminasi di reverse proxy di depan container (mis. Caddy/Traefik/Cloudflare).
    # Reverse proxy wajib melakukan redirect HTTP -> HTTPS. Container hanya menyajikan HTTPS traffic yang di-proxy.

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-XSS-Protection "0" always;

    # Content-Security-Policy — longgar di awal (allow Supabase + inline), rapatkan setelah audit.
    # Catatan: 'unsafe-inline' script dipakai splash loader di index.html dan structured-data (ld+json).
    #         Vite production tidak men-inject inline script di luar itu.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://*.plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://plausible.io https://*.plausible.io https://*.ingest.sentry.io https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Aset hasil build (nama file berhash) boleh di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Favicon & gambar statis — cache 7 hari
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML dan manifest selalu di-revalidate
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type "application/manifest+json";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # Blokir dotfiles (.git, .env, dll.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # SPA routing (/r/:id, /requests, dst.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
